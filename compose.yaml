services:
  postgres:
    image: postgres:16-alpine
    container_name: keitaro-postgres
    environment:
      POSTGRES_USER: keitaro
      POSTGRES_PASSWORD: keitaro
      POSTGRES_DB: keitaro
    ports:
      - "54330:5432"
    volumes:
      - keitaro-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keitaro -d keitaro"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    profiles: ["api"]
    build:
      context: ./apps/api
    container_name: keitaro-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://keitaro:keitaro@postgres:5432/keitaro
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  keitaro-pg:
