services:
  postgres:
    image: postgres:16-alpine
    container_name: keitaro-postgres
    environment:
      POSTGRES_USER: keitaro
      POSTGRES_PASSWORD: keitaro
      POSTGRES_DB: keitaro
    ports:
      - "54330:5432"
    volumes:
      - keitaro-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keitaro -d keitaro"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    profiles: ["api", "app"]
    env_file:
      - .env
      - .env.docker
    build:
      context: ./apps/api
    container_name: keitaro-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen(os.environ['API_HEALTH_URL'])\"",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    profiles: ["app"]
    build:
      context: ./apps/web
      args:
        CAMPAIGN_PREFIX: ${CAMPAIGN_PREFIX}
    container_name: keitaro-web
    env_file:
      - .env.docker
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"$$WEB_HEALTH_URL\""]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  keitaro-pg:
